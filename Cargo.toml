[workspace]
resolver = "3"
members = ["crates/gallery-core", "crates/gallery-cli", "crates/gallery-gui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/grigorii-horos/gallery"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
