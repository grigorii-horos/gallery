name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Applied sources go to a folder, never the runner's system trash.
  GALLERY_TRASH: folder

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ---- system libraries and the media tools the tests drive ----
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libssl-dev pkg-config \
            ffmpeg libimage-exiftool-perl libavif-bin optipng libfuse2t64
      - name: ImageMagick 7 (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true # tests needing magick skip when it is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/tools"
          gh release download --repo ImageMagick/ImageMagick --pattern '*-gcc-x86_64.AppImage' --dir "$HOME/tools"
          mv "$HOME/tools"/ImageMagick-*-gcc-x86_64.AppImage "$HOME/tools/magick"
          chmod +x "$HOME/tools/magick"
          echo "$HOME/tools" >> "$GITHUB_PATH"

      - name: macOS packages
        if: runner.os == 'macOS'
        continue-on-error: true
        run: brew install ffmpeg exiftool libavif imagemagick optipng

      - name: Windows packages
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install -y --no-progress ffmpeg exiftool imagemagick optipng
      - name: avifenc (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/libavif"
          gh release download --repo AOMediaCodec/libavif --pattern 'windows-artifacts.zip' --dir "$RUNNER_TEMP/libavif"
          unzip -o "$RUNNER_TEMP/libavif/windows-artifacts.zip" -d "$RUNNER_TEMP/libavif"
          echo "$RUNNER_TEMP/libavif" >> "$GITHUB_PATH"

      # Chocolatey's ffmpeg lacks libsvtav1/libopus/vidstab, which the tests drive.
      - name: ffmpeg full build (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          gh release download --repo BtbN/FFmpeg-Builds --pattern 'ffmpeg-master-latest-win64-gpl.zip' --dir "$RUNNER_TEMP/ffmpeg"
          unzip -q -o "$RUNNER_TEMP/ffmpeg/ffmpeg-master-latest-win64-gpl.zip" -d "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg/ffmpeg-master-latest-win64-gpl/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        continue-on-error: true
        run: |
          exiftool -ver || true
          ffmpeg -version | head -1 || true
          for t in ffmpeg exiftool avifenc magick optipng; do
            if command -v "$t" >/dev/null; then echo "found $t"; else echo "MISSING $t (its tests will skip)"; fi
          done

      # ---- front end (the GUI crate embeds ui/dist) ----
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui typecheck
      - run: pnpm -C ui lint
      - run: pnpm -C ui test
      - run: pnpm -C ui build

      # ---- Rust ----
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
