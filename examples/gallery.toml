# Example Gallery configuration.

# ai_prefix / ai_suffix frame the AI category list in the system prompt for
# this source's files: the prefix goes before the list, the suffix after it
# and before the answer format. Each is inline text (ai_prefix = """...""")
# or a file (not both), relative to this config, `~` expanded; changing them
# re-asks the AI for the source's files.
[[sources]]
id = "camera"
path = "~/Sync/Camera"
ai_prefix_file = "ai/camera-prefix.md"
ai_suffix_file = "ai/camera-suffix.md"

# A second phone: its photos are neighbours of the camera's in `near` and `event`.
[[sources]]
id = "partner"
path = "~/Sync/Partner-Photo"

# Screenshots stay in their own folder: they are only renamed there.
[[sources]]
id = "screenshots"
path = "~/Sync/Camera/Screenshots"

[ai]
model = "claude-sonnet-5-5"
effort = "low"
jobs = 8
# Language the model writes each answer's `reason` in: a name or a code
# ("en", "ru", "Ukrainian"). Category names and descriptions are sent as written.
language = "en"

# Named points for the `geo` condition (`geo = "@home"`). Also edited in the
# GUI under Settings. `km` is the radius.
[places]
home = { lat = 47.0245, lon = 28.8323, km = 2 }
dacha = { lat = 46.98, lon = 28.70, km = 1 }

# ---- presets ----

# Built-in presets need no definition here: "capture-date", "file-date",
# "capture-date-dirs", "capture-date-name", "ext-lower" (name) and "meta-full",
# "meta-dates", "avif-high", "av1-high", ... (content); `gallery presets`
# lists them. A preset of your own must have another name: redefining a
# built-in one is an error. A preset may carry a default `mask = "..."`;
# without one it gets the default of its kind:
#   photo presets (avif-*, webp-*)  @photo-original = jpg jpeg heic heif
#   video presets (av1-*)           @video-original = mp4 m4v mov mkv, not *.av1.mp4
#   audio presets (opus-*, ...)     @audio = mp3 m4a aac flac wav ogg opus wma ape alac
#   png-optipng                     @png = png
#   meta-*, name presets            *
#
# A bundle is one name for an ordered list of presets, each on its own mask:
# "compress-all" = avif-high, png-avif, webp-avif, av1-high (every file type
# gets exactly one encoder), "compress-photos" (the first three) and
# "compress-fast". Make your own:
#   [content_presets.my-pack]
#   kind = "bundle"
#   steps = ["avif-high", { mask = "*.png", preset = "png-avif" }]
# A bundle has no mask of its own; a step that uses a bundle takes no mask.
#
# Masks are written as `*.{jpg,png}` globs or `^regex`. `@name` refers to a
# named mask; an item starting with `!` excludes (`["*.mp4", "!*.av1.mp4"]`,
# `"!@raw"`): a name must match one plain item and no `!` item, and a list of
# only `!` items means "everything except". Any mask slot (filter `match`,
# `exclude`, a step's `mask`, a preset's `mask`) also takes a list, which means OR: ["@photo", "@video"].
# Built-in masks (`gallery presets` prints them):
#   @photo          jpg jpeg heic heif webp avif tif tiff bmp gif
#   @photo-original jpg jpeg heic heif
#   @video          mp4 m4v mov mkv webm avi 3gp
#   @video-original mp4 m4v mov mkv, not *.av1.mp4
#   @raw            cr2 cr3 nef arw dng raf orf rw2
#   @audio          mp3 m4a aac flac wav ogg opus wma ape alac
#   @png            png
#   @media          @photo + @video + @png
# Built-in name patterns:
#   @screenshot       *screenshot*.{png,jpg,jpeg,webp}, "Знімок екрана*", "Снимок экрана*"
#   @screen-recording screen-*, *screenrecord*, *screen_record*, *screencast*  (mp4 webm mkv mov)
#   @tiktok           32 hex digits [_n] .mp4 .png .webp .jpg .jpeg
#   @dated            already named YYYYMMDD_HHMMSS...
#   @whatsapp         IMG|VID|AUD|PTT-YYYYMMDD-WA<n>
#   @epoch-name       13 or 10 digit epoch timestamp names
#   @camera-phone     IMG|VID|PXL|MVIMG_YYYYMMDD_HHMMSS
#   @edited           names with -edited or _edited
#   @copy             duplicate markers: (1) (2) (3) _copy -copy "- copy"
# Your own masks go to [masks]; a name taken by a built-in one is an error.
[masks]
phone-media = ["@photo", "@video"]

# A name template may hold `/`: the parts before the last one are folders
# below the output directory, the last one is the file name (see the
# built-in "capture-date-dirs": year/month). Add a skip_if only to a template
# without `/`.
[name_presets."TikTok"]
template = "tiktok_{date}_{stem}.{ext}"
date = "file_created"

# ---- targets ----
#
# One ordered list. Each file walks it from the top and the first target
# whose filter matches takes the file; later targets never see it. A filter
# is `sources` plus conditions, and all of its conditions must hold; a target
# with several filters takes a file that any one of them matches. `kind` is
# "folders" (default: place the file into `outputs`), "trash" (move it to the
# trash, no outputs) or "keep" (take it and do nothing: protects it from the
# targets below). Files no target takes stay where they are.

# Copies of the same file. Exactly one copy of a group never matches, and a
# scan never trashes the last copy of a group: if every copy would be trashed
# one is held for review instead.
[[targets]]
name = "Duplicates"
kind = "trash"

[[targets.filters]]
sources = ["camera", "partner"]
duplicate = { of = ["sources", "outputs"] }

# Burst shots and re-takes: near-identical frames seconds apart. Every shot
# of a series but the sharpest matches, and a series match goes to review
# first: you see the whole series, confirm (or change) the best shot, and
# only then are the others trashed.
[[targets]]
name = "Blurry re-takes"
kind = "trash"

[[targets.filters]]
sources = ["camera"]
match = "@photo"
series = { gap = "5s", similar = true, keep = "best", by = "sharpness" }

# In-place sorting: the output folder is the source folder and no content
# preset runs, so each file is moved into <year>/<month> of its own folder and
# renamed by date (not copied, not trashed). The source is non-recursive, so
# a moved file is not scanned again; a file already at its path is left alone
# and not even planned; one without a date stays where it is.
[[targets]]
name = "Screenshots"

[[targets.filters]]
sources = ["screenshots"]
match = "*"

[[targets.outputs]]
dir = "~/Sync/Camera/Screenshots"
rename = ["capture-date-dirs"]

# Screenshots and screen recordings that land among camera photos: a
# processed copy by year plus a byte-for-byte backup.
[[targets]]
name = "Screenshots and screen recordings"

# A list is OR: screenshots and screen recordings.
[[targets.filters]]
sources = ["camera", "partner"]
match = ["@screenshot", "@screen-recording"]

[[targets.outputs]]
dir = "~/Media/Screenshots/{YYYY}"
content = ["meta-full"]
rename = ["capture-date"]

[[targets.outputs]]
dir = "~/Backup/Screenshots"

[[targets]]
name = "TikTok"

[[targets.filters]]
sources = ["camera"]
match = "@tiktok"

[[targets.outputs]]
dir = "~/Media/TikTok"
rename = ["TikTok"]

# Keep: takes the file and leaves it where it is, so no target below touches
# it. Here: camera photos shot at home between 22:00 and 05:00.
[[targets]]
name = "Night shots at home"
kind = "keep"

[[targets.filters]]
sources = ["camera"]
geo = "@home"
date = { time = "22:00..05:00" }

# Photos taken together. Each filter takes a file of its source when the
# other phone shot something within 2 hours and 1 km (a file without GPS is
# compared by time alone), and `expand = "event"` then takes every file of
# the same event, also frames where the other person is not around. An event
# is a run of camera and partner files with no gap over 4 hours. Both phones
# put their files into one shared folder.
[[targets]]
name = "Together"

[[targets.filters]]
sources = ["camera"]
match = "@phone-media"
near = { sources = ["partner"], time = "2h", km = 1 }
expand = "event"
event = { sources = ["camera", "partner"], gap = "4h" }

[[targets.filters]]
sources = ["partner"]
match = "@phone-media"
near = { sources = ["camera"], time = "2h", km = 1 }
expand = "event"
event = { sources = ["camera", "partner"], gap = "4h" }

[[targets.outputs]]
dir = "~/Sync/Shared/{YYYY}"
rename = ["capture-date"]

# ---- AI targets ----
#
# `ai` is a condition like any other: a file reaches the AI only when it gets
# to this filter in list order and its other conditions hold. The category is
# the target name; the model picks one category or none.

[[targets]]
name = "Documents"

[[targets.filters]]
sources = ["camera"]
match = "@photo"
ai = "Photos of documents: passports, contracts, forms, printed pages."

[[targets.outputs]]
dir = "~/Documents/Scans"
rename = ["capture-date"]

[[targets]]
name = "Receipts"

[[targets.filters]]
sources = ["camera"]
match = "@photo"
ai = "Photos of receipts, invoices and price tags."

[[targets.outputs]]
dir = "~/Documents/Receipts"
rename = ["capture-date"]

# ---- everything else ----

[[targets]]
name = "Timeline"

# Only photos and videos (@phone-media) are taken: PNG, RAW and audio files
# stay where they are.
[[targets.filters]]
sources = ["camera", "partner"]
match = "@phone-media"

# Processed copy: metadata, then compress-all (AVIF for photos, PNG and WebP,
# AV1 for videos; the filter above only lets photos and videos in). A bare
# preset name uses the preset's own mask (`gallery presets` shows it: photos
# for avif-*, videos for av1-*, everything for meta-* and name presets); write
# `{ mask = "*.png", preset = "avif-high" }` to override it.
[[targets.outputs]]
dir = "~/Media/Timeline/{YYYY}/{MM}"
content = ["meta-full", "compress-all"]
rename = ["capture-date"]

# Backup: byte-for-byte copy.
[[targets.outputs]]
dir = "~/Backup/Timeline/{YYYY}/{MM}"
