[package]
name = "gallery-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
gallery-core = { path = "../gallery-core" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
serde_json = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
blake3 = "1"
wiremock = "0.6.5"
tokio = { version = "1", features = ["rt-multi-thread"] }
